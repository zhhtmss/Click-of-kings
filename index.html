<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Click of Kings</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

    <!-- LOADING SCREEN -->
    <div id="loader">
        <div class="loader-content">
            <h1>Click of Kings</h1>
            <p>Пробуждаем королевство...</p>
            <div class="spinner"></div>
        </div>
    </div>

    <!-- GAME WRAPPER -->
    <div id="game" class="hidden">

        <!-- BACKGROUND -->
        <div id="background"></div>

        <!-- HUD -->
        <header class="hud">
            <div class="left">
                <h1>Click of Kings</h1>
                <span id="eraName">Загрузка...</span>
            </div>

            <div class="right">
                <div><span id="resourceName">Власть</span>: <span id="resources">0</span></div>
                <div>Клик: <span id="perClick">1</span></div>
                <div>Доход: <span id="autoIncome">0</span>/с</div>
                <button id="soundToggle" class="sound-toggle" type="button" aria-label="Включить или выключить звук">Звук: вкл</button>
            </div>
        </header>

        <div class="content-layout">
            <!-- CLICK SHOP -->
            <aside class="shop shop-click">
                <h2>Click Upgrades</h2>
                <div id="clickUpgradesList"></div>
            </aside>

            <!-- GAME AREA -->
            <main class="game-area">
                <section class="era-panel" aria-live="polite">
                <p id="eraDescription">Развивайте цивилизацию кликами и улучшениями.</p>
                <div class="progress-wrap">
                    <div class="progress-label">
                        <span id="nextEraLabel">Следующая эпоха</span>
                        <span id="nextEraCost">0</span>
                    </div>
                    <div class="progress-bar">
                        <span id="eraProgress"></span>
                    </div>
                </div>
                </section>

                <button id="clickButton" class="click-button" type="button">
                <img id="clickImage" src="assets/images/items/era1_click.webp" alt="Первобытная эпоха">
                </button>
            </main>

            <!-- PASSIVE SHOP -->
            <aside class="shop shop-auto">
                <h2>Income Per Second</h2>
                <div id="autoUpgradesList"></div>
            </aside>
        </div>

    </div>

    <!-- SCRIPTS -->
    <script src="js/loader.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/game.js"></script>
    <script src="js/upgrades.js"></script>
    <script src="js/eras.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
