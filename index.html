
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cosmic Tapper ✦ Космічний клікер</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(ellipse at 20% 30%, #0a0f2e, #03050b);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', 'Orbitron', monospace;
            padding: 20px;
        }

        /* завантажувальний екран */
        .splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #03050be6;
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.6s ease;
        }

        .spaceship {
            width: 80px;
            height: 80px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><polygon points="50,10 70,40 85,45 70,55 75,80 50,70 25,80 30,55 15,45 30,40" fill="%23ffd966" stroke="%23ffaa33" stroke-width="2"/><circle cx="50" cy="45" r="6" fill="%23fff"/><path d="M45 55 L55 55 L52 65 L48 65Z" fill="%23ccaa55"/></svg>') no-repeat center;
            background-size: contain;
            animation: float 1.2s infinite ease;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg);}
            50% { transform: translateY(-15px) rotate(3deg);}
            100% { transform: translateY(0px) rotate(0deg);}
        }

        .loading-text {
            margin-top: 25px;
            color: #b9e6ff;
            font-size: 1.6rem;
            letter-spacing: 4px;
            font-weight: bold;
            background: linear-gradient(135deg, #fff, #ffd966);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* головний контейнер гри */
        .game-container {
            max-width: 550px;
            width: 100%;
            background: rgba(10, 20, 40, 0.65);
            backdrop-filter: blur(3px);
            border-radius: 58px;
            padding: 18px 22px 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            border: 1px solid rgba(255,210,90,0.3);
        }

        .stats-bar {
            background: #0a0e1cd9;
            border-radius: 80px;
            padding: 12px 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            font-weight: bold;
        }

        .stat {
            background: #00000066;
            padding: 5px 15px;
            border-radius: 40px;
            color: #ffefb9;
            font-size: 1.1rem;
        }

        .stat span {
            color: #fdbe34;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .click-area {
            display: flex;
            justify-content: center;
            margin: 15px 0 10px;
            cursor: pointer;
        }

        .planet {
            width: 210px;
            height: 210px;
            background: radial-gradient(circle at 35% 35%, #ffc487, #e07a1f);
            border-radius: 50%;
            box-shadow: 0 0 40px #ffb34777, 0 20px 25px rgba(0,0,0,0.4);
            transition: transform 0.08s linear;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            text-shadow: 0 0 12px yellow;
            color: #fff6cf;
        }

        .planet:active {
            transform: scale(0.94);
        }

        .upgrades {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 25px 0 10px;
        }

        .upgrade-card {
            background: linear-gradient(105deg, #11161f, #03060e);
            border-radius: 48px;
            padding: 8px 18px 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-left: 5px solid #f5b642;
            transition: all 0.2s;
        }

        .upgrade-info {
            flex: 2;
        }

        .upgrade-name {
            font-weight: bold;
            color: #ffd966;
            font-size: 1.1rem;
        }

        .upgrade-desc {
            font-size: 0.75rem;
            color: #97b9e0;
        }

        .upgrade-level {
            font-size: 0.9rem;
            color: white;
            background: #00000099;
            padding: 2px 10px;
            border-radius: 30px;
        }

        .upgrade-cost {
            background: #e6b42233;
            padding: 5px 15px;
            border-radius: 32px;
            font-weight: bold;
            color: #ffb347;
        }

        button.buy {
            background: #f5b642;
            border: none;
            padding: 8px 20px;
            border-radius: 60px;
            font-weight: bold;
            font-family: monospace;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.1s linear;
            box-shadow: 0 2px 6px black;
        }
        button.buy:active { transform: scale(0.96);}
        button.buy:disabled { opacity: 0.5; transform: none; cursor: not-allowed;}

        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            gap: 12px;
        }

        .ctrl-btn {
            background: #262f41;
            border: none;
            color: white;
            padding: 7px 12px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        footer {
            font-size: 0.7rem;
            text-align: center;
            margin-top: 20px;
            color: #7e8aa8;
        }

        @keyframes pop {
            0% { transform: scale(1);}
            50% { transform: scale(1.2); text-shadow: 0 0 20px gold;}
            100% { transform: scale(1);}
        }
        .click-effect {
            animation: pop 0.2s ease;
        }
    </style>
</head>
<body>
<div class="splash" id="splashScreen">
    <div class="spaceship"></div>
    <div class="loading-text">▶ ЗАВАНТАЖЕННЯ КОСМОСУ ◀</div>
    <div style="margin-top: 20px; width: 140px; height: 3px; background: #333; border-radius: 3px; overflow:hidden;">
        <div id="loadingProgress" style="width: 0%; height: 100%; background: #fdbe34; transition: width 0.3s;"></div>
    </div>
</div>

<div class="game-container" id="gameUI" style="display: none;">
    <div class="stats-bar">
        <div class="stat">✨ Сяйво: <span id="lightBalance">0</span></div>
        <div class="stat">⚡/сек: <span id="perSec">0</span></div>
        <div class="stat">🖱️ Кліки: <span id="totalClicks">0</span></div>
    </div>

    <div class="click-area" id="clickerZone">
        <div class="planet" id="planetObj">
            🌙✨
        </div>
    </div>

    <div class="upgrades" id="upgradesList"></div>

    <div class="controls">
        <button class="ctrl-btn" id="resetBtn">🔄 Скинути прогрес</button>
        <button class="ctrl-btn" id="toggleMusicBtn">🎵 Музика: УВІМК</button>
        <button class="ctrl-btn" id="toggleSfxBtn">🔊 Звуки: УВІМК</button>
    </div>
    <footer>🌌 Космічний клікер | кожен клік приносить силу зір</footer>
</div>

<script>
    (function() {
        // ---------- АУДІО через Web Audio (генерація, без зовнішніх файлів) ----------
        let audioCtx = null;
        let musicGain = null;
        let sfxGain = null;
        let musicInterval = null;
        let musicEnabled = true;
        let sfxEnabled = true;

        function initAudio() {
            if(audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            musicGain = audioCtx.createGain();
            sfxGain = audioCtx.createGain();
            musicGain.gain.value = musicEnabled ? 0.25 : 0;
            sfxGain.gain.value = sfxEnabled ? 0.5 : 0;
            musicGain.connect(audioCtx.destination);
            sfxGain.connect(audioCtx.destination);
        }

        function playClickSound() {
            if(!sfxEnabled || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(sfxGain);
            osc.frequency.value = 780;
            gain.gain.value = 0.2;
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.3);
            osc.stop(audioCtx.currentTime + 0.25);
        }

        function playPurchaseSound() {
            if(!sfxEnabled || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(sfxGain);
            osc.frequency.value = 450;
            gain.gain.value = 0.15;
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.2);
            osc.stop(audioCtx.currentTime + 0.2);
            // другий тон
            setTimeout(()=>{
                if(!audioCtx) return;
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.connect(gain2);
                gain2.connect(sfxGain);
                osc2.frequency.value = 660;
                gain2.gain.value = 0.1;
                osc2.start();
                gain2.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.2);
                osc2.stop(audioCtx.currentTime + 0.2);
            },50);
        }

        function startBackgroundMusic() {
            if(!musicEnabled || !audioCtx) return;
            if(musicInterval) clearInterval(musicInterval);
            let step = 0;
            musicInterval = setInterval(()=>{
                if(!musicEnabled || !audioCtx) return;
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(musicGain);
                const notes = [261.63, 293.66, 329.63, 392.00];
                osc.frequency.value = notes[step % notes.length];
                gain.gain.value = 0.07;
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.6);
                osc.stop(now + 0.6);
                step++;
            }, 1550);
        }

        function stopMusic() {
            if(musicInterval) clearInterval(musicInterval);
            musicInterval = null;
        }

        // ---- Ігровий стан ----
        let light = 100;        // стартовий баланс
        let totalClicks = 0;
        let clickPower = 1;     // базове сяйво за клік
        let upgrades = {
            miner: { level:0, baseCost: 25, cost:25,  income:1,  name:"⛏️ Місячний майнер", desc:"Автоклікер +1/сек" },
            concentrator: { level:0, baseCost: 40, cost:40,  clickBonus:1, name:"☀️ Сонячний концентратор", desc:"+1 до кліку" },
            telescope: { level:0, baseCost: 100, cost:100, mult:0.02, name:"🔭 Телескоп глибокого неба", desc:"+2% до автоклікерів за рівень" }
        };

        let lastTimestamp = 0;
        let passiveInterval = null;

        function calcIncomePerSec() {
            let baseIncome = upgrades.miner.level * upgrades.miner.income;
            let mult = 1 + (upgrades.telescope.level * upgrades.telescope.mult);
            let total = baseIncome * mult;
            return Math.floor(total);
        }

        function updateUI() {
            document.getElementById('lightBalance').innerText = Math.floor(light);
            document.getElementById('perSec').innerText = calcIncomePerSec();
            document.getElementById('totalClicks').innerText = totalClicks;
            // оновити картки покращень
            const container = document.getElementById('upgradesList');
            container.innerHTML = '';
            for(let [id, up] of Object.entries(upgrades)) {
                let canAfford = light >= up.cost;
                let effectText = '';
                if(id === 'miner') effectText = `+${up.income * (1+(upgrades.telescope.level*0.02)).toFixed(2)}/сек (рівень ${up.level})`;
                else if(id === 'concentrator') effectText = `+${up.clickBonus} до кліку (рівень ${up.level}) | клік: +${clickPower}✨`;
                else effectText = `бонус до автоклікерів +${(up.mult*100).toFixed(0)}%/рівень (зараз +${(upgrades.telescope.level*up.mult*100).toFixed(0)}%)`;
                const card = document.createElement('div');
                card.className = 'upgrade-card';
                card.innerHTML = `
                    <div class="upgrade-info">
                        <div class="upgrade-name">${up.name}</div>
                        <div class="upgrade-desc">${up.desc} | ${effectText}</div>
                        <div class="upgrade-level">📡 рівень ${up.level}</div>
                    </div>
                    <div class="upgrade-cost">💰 ${Math.ceil(up.cost)}</div>
                    <button class="buy" data-id="${id}" ${!canAfford ? 'disabled' : ''}>Придбати</button>
                `;
                container.appendChild(card);
            }
            document.querySelectorAll('.buy').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = btn.getAttribute('data-id');
                    buyUpgrade(id);
                });
            });
        }

        function buyUpgrade(id) {
            let up = upgrades[id];
            if(light >= up.cost) {
                light -= up.cost;
                up.level++;
                if(id === 'miner') {
                    up.cost = Math.floor(up.baseCost * Math.pow(1.18, up.level));
                } else if(id === 'concentrator') {
                    up.cost = Math.floor(up.baseCost * Math.pow(1.22, up.level));
                    clickPower = 1 + (upgrades.concentrator.level * upgrades.concentrator.clickBonus);
                } else if(id === 'telescope') {
                    up.cost = Math.floor(up.baseCost * Math.pow(1.25, up.level));
                }
                playPurchaseSound();
                saveGame();
                updateUI();
                // додатковий ефект
            } else {
                // не вистачає
            }
        }

        function addLight(amount) {
            light += amount;
            if(light < 0) light = 0;
            updateUI();
        }

        function handleClick() {
            let earned = clickPower;
            light += earned;
            totalClicks++;
            playClickSound();
            // анімація планети
            const planetDiv = document.getElementById('planetObj');
            planetDiv.classList.add('click-effect');
            setTimeout(() => planetDiv.classList.remove('click-effect'), 180);
            // відображення тексту +1
            updateUI();
            saveGame();
        }

        // пасивний дохід
        function startPassiveIncome() {
            if(passiveInterval) clearInterval(passiveInterval);
            passiveInterval = setInterval(() => {
                let income = calcIncomePerSec();
                if(income > 0) {
                    light += income;
                    updateUI();
                    saveGame();
                }
            }, 1000);
        }

        // LOCALSTORAGE
        function saveGame() {
            const save = {
                light: Math.floor(light),
                totalClicks: totalClicks,
                clickPower: clickPower,
                upgrades: {
                    miner: { level: upgrades.miner.level, cost: upgrades.miner.cost },
                    concentrator: { level: upgrades.concentrator.level, cost: upgrades.concentrator.cost },
                    telescope: { level: upgrades.telescope.level, cost: upgrades.telescope.cost }
                },
                musicEnabled: musicEnabled,
                sfxEnabled: sfxEnabled
            };
            localStorage.setItem('cosmicTapperSave', JSON.stringify(save));
        }

        function loadGame() {
            const raw = localStorage.getItem('cosmicTapperSave');
            if(!raw) return;
            try {
                const data = JSON.parse(raw);
                light = data.light ?? 100;
                totalClicks = data.totalClicks ?? 0;
                clickPower = data.clickPower ?? 1;
                if(data.upgrades) {
                    if(data.upgrades.miner) {
                        upgrades.miner.level = data.upgrades.miner.level;
                        upgrades.miner.cost = data.upgrades.miner.cost;
                    }
                    if(data.upgrades.concentrator) {
                        upgrades.concentrator.level = data.upgrades.concentrator.level;
                        upgrades.concentrator.cost = data.upgrades.concentrator.cost;
                        clickPower = 1 + (upgrades.concentrator.level * upgrades.concentrator.clickBonus);
                    }
                    if(data.upgrades.telescope) {
                        upgrades.telescope.level = data.upgrades.telescope.level;
                        upgrades.telescope.cost = data.upgrades.telescope.cost;
                    }
                }
                musicEnabled = data.musicEnabled ?? true;
                sfxEnabled = data.sfxEnabled ?? true;
                if(audioCtx) {
                    if(musicGain) musicGain.gain.value = musicEnabled ? 0.25 : 0;
                    if(sfxGain) sfxGain.gain.value = sfxEnabled ? 0.5 : 0;
                }
                if(musicEnabled) startBackgroundMusic();
                else stopMusic();
                document.getElementById('toggleMusicBtn').innerText = musicEnabled ? "🎵 Музика: УВІМК" : "🎵 Музика: ВИМК";
                document.getElementById('toggleSfxBtn').innerText = sfxEnabled ? "🔊 Звуки: УВІМК" : "🔊 Звуки: ВИМК";
            } catch(e) {}
            updateUI();
        }

        function resetGame() {
            if(confirm("🔄 Скинути весь космічний прогрес?")) {
                light = 100;
                totalClicks = 0;
                clickPower = 1;
                upgrades.miner = { level:0, baseCost: 25, cost:25, income:1, name:"⛏️ Місячний майнер", desc:"Автоклікер +1/сек" };
                upgrades.concentrator = { level:0, baseCost: 40, cost:40, clickBonus:1, name:"☀️ Сонячний концентратор", desc:"+1 до кліку" };
                upgrades.telescope = { level:0, baseCost: 100, cost:100, mult:0.02, name:"🔭 Телескоп глибокого неба", desc:"+2% до автоклікерів за рівень" };
                saveGame();
                updateUI();
                playPurchaseSound(); // звук скидання
            }
        }

        // ---- Завантажувальний екран (симуляція) ----
        function hideSplashAndStart() {
            const splash = document.getElementById('splashScreen');
            const gameUI = document.getElementById('gameUI');
            splash.style.opacity = '0';
            setTimeout(() => {
                splash.style.display = 'none';
                gameUI.style.display = 'block';
                initAudio();
                // AudioContext має бути запущений після жесту, але ми стартуємо по першому кліку
                // Додаємо слухач для активації аудіо
                const resumeAudio = () => {
                    if(audioCtx && audioCtx.state !== 'running') {
                        audioCtx.resume().then(() => {
                            if(musicEnabled) startBackgroundMusic();
                        });
                    }
                    document.removeEventListener('click', resumeAudio);
                    document.removeEventListener('touchstart', resumeAudio);
                };
                document.addEventListener('click', resumeAudio);
                document.addEventListener('touchstart', resumeAudio);
                loadGame();
                startPassiveIncome();
                updateUI();
            }, 500);
        }

        // симуляція завантаження
        let progress = 0;
        const progBar = document.getElementById('loadingProgress');
        const intervalLoad = setInterval(() => {
            progress += Math.random() * 25;
            if(progress >= 100) {
                progress = 100;
                clearInterval(intervalLoad);
                if(progBar) progBar.style.width = '100%';
                setTimeout(hideSplashAndStart, 400);
            }
            if(progBar) progBar.style.width = progress + '%';
        }, 180);
        
        // кнопки інтерфейсу після запуску
        window.onload = () => {
            document.getElementById('resetBtn')?.addEventListener('click', resetGame);
            document.getElementById('toggleMusicBtn')?.addEventListener('click', () => {
                musicEnabled = !musicEnabled;
                if(audioCtx) {
                    if(musicGain) musicGain.gain.value = musicEnabled ? 0.25 : 0;
                    if(musicEnabled) startBackgroundMusic();
                    else stopMusic();
                }
                document.getElementById('toggleMusicBtn').innerText = musicEnabled ? "🎵 Музика: УВІМК" : "🎵 Музика: ВИМК";
                saveGame();
            });
            document.getElementById('toggleSfxBtn')?.addEventListener('click', () => {
                sfxEnabled = !sfxEnabled;
                if(audioCtx && sfxGain) sfxGain.gain.value = sfxEnabled ? 0.5 : 0;
                document.getElementById('toggleSfxBtn').innerText = sfxEnabled ? "🔊 Звуки: УВІМК" : "🔊 Звуки: ВИМК";
                saveGame();
            });
            document.getElementById('clickerZone')?.addEventListener('click', (e) => {
                if(document.getElementById('gameUI').style.display !== 'block') return;
                handleClick();
            });
        };
    })();
</script>
</body>
</html>
